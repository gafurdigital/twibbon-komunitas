<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibbon Resmi Komunitas</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://jsdelivr.net"></script>
    <style>
        #canvasContainer canvas {
            max-width: 100%;
            height: auto !important;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 1. HALAMAN LOGIN / PROTEKSI KOMUNITAS -->
    <div id="loginPage" class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md text-center">
        <div class="flex justify-center mb-4">
            <img src="https://picsum.photos" id="communityLogoLogin" alt="Logo Komunitas" class="w-20 h-20 object-contain rounded-full shadow-sm">
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-2">🛡️ Twibbon Komunitas</h1>
        <p class="text-gray-500 text-sm mb-6">Masukkan kata sandi komunitas untuk mengakses aplikasi.</p>
        <input type="password" id="passwordInput" placeholder="Kata Sandi Komunitas" 
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4 text-center">
        <button onclick="cekPassword()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
            Masuk Aplikasi
        </button>
        <p id="loginError" class="text-red-500 text-sm mt-3 hidden">Kata sandi salah, Bro! Silakan tanya admin.</p>
    </div>

    <!-- 2. HALAMAN UTAMA TWIBBON -->
    <div id="mainPage" class="bg-white p-6 rounded-2xl shadow-md w-full max-w-xl hidden text-center">
        
        <div class="flex items-center justify-center gap-3 mb-4 border-b border-gray-100 pb-4">
            <img src="https://picsum.photos" id="communityLogoMain" alt="Logo" class="w-12 h-12 object-contain rounded-full">
            <div class="text-left">
                <h1 class="text-xl font-bold text-gray-800 leading-tight">Twibbon Maker</h1>
                <p class="text-xs text-gray-500">Official Community Web App</p>
            </div>
        </div>

        <!-- Area Canvas -->
        <div id="canvasContainer" class="flex justify-center mb-6 bg-gray-50 p-2 rounded-xl border border-dashed border-gray-300">
            <canvas id="twibbonCanvas" width="800" height="800" class="w-full max-w-[400px] aspect-square"></canvas>
        </div>

        <!-- Kontrol Pilihan, Input Nama, dan Upload -->
        <div class="space-y-4 text-left max-w-sm mx-auto">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">1. Pilih Bingkai / Peringkat</label>
                <!-- DI SINI SUDAH DISESUAIKAN HANYA ADA 3 PILIHAN BINGKAI -->
                <select id="pilihBingkai" onchange="gantiBingkai(this.value)" class="w-full px-3 py-2 border border-gray-300 rounded-lg bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <option value="umum">Bingkai Utama (Semua Member)</option>
                    <option value="rank1">Bingkai Peringkat 1 (Bronze)</option>
                    <option value="rank2">Bingkai Peringkat 2 (Silver)</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">2. Tulis Nama Member</label>
                <input type="text" id="inputNama" oninput="updateNama(this.value)" placeholder="CONTOH: BUDI SANTOSO" 
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm font-semibold">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">3. Upload Fotomu</label>
                <input type="file" id="uploadFoto" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>

            <div id="sliderKontrol" class="hidden space-y-2">
                <label class="block text-sm font-medium text-gray-700">4. Atur Ukuran Foto (Zoom)</label>
                <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" value="1" class="w-full accent-blue-600">
            </div>

            <button id="btnDownload" onclick="downloadHasil()" disabled class="w-full bg-gray-400 text-white font-bold py-3 rounded-xl transition cursor-not-allowed mt-4">
                5. Download Twibbon
            </button>
        </div>
    </div>

    <script>
        // --- KONFIGURASI UTAMA ---
        const PASSWORD_KOMUNITAS = "KopiHitam2026"; 
        const URL_LOGO_KOMUNITAS = "https://picsum.photos"; 

        // 🚨 DI SINI HANYA ADA 3 DAFTAR LINK BINGKAI AKTIF
        // Tempel direct link dari Postimages/Imgur kamu yang berakhiran `.png` di sini
        const DAFTAR_BINGKAI = {
            umum: "https://picsum.photos",  // Link Bingkai Utama
            rank1: "https://picsum.photos", // Link Bingkai Bronze kamu
            rank2: "https://picsum.photos"  // Link Bingkai Silver kamu
        };

        document.getElementById('communityLogoLogin').src = URL_LOGO_KOMUNITAS;
        document.getElementById('communityLogoMain').src = URL_LOGO_KOMUNITAS;

        // Element DOM Canvas
        const canvas = document.getElementById('twibbonCanvas');
        const ctx = canvas.getContext('2d');
        let fotoUser = new Image();
        let bingkaiTwibbon = new Image();

        let namaMember = "";
        let fotoX = 400, fotoY = 400;
        let fotoScale = 1;
        let isDragging = false;
        let startX, startY;

        function cekPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD_KOMUNITAS) {
                document.getElementById('loginPage').classList.add('hidden');
                document.getElementById('mainPage').classList.remove('hidden');
                gantiBingkai('umum'); // Bingkai default saat masuk
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        function gantiBingkai(key) {
            bingkaiTwibbon.crossOrigin = "anonymous"; 
            bingkaiTwibbon.src = DAFTAR_BINGKAI[key];
            bingkaiTwibbon.onload = () => { gambarUlangCanvas(); };
        }

        function updateNama(teks) {
            namaMember = teks.toUpperCase(); 
            gambarUlangCanvas();
        }

        document.getElementById('uploadFoto').addEventListener('change', function(e) {
            const file = e.target.files;
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                fotoUser.onload = () => {
                    fotoX = canvas.width / 2; fotoY = canvas.height / 2;
                    fotoScale = Math.max(canvas.width / fotoUser.width, canvas.height / fotoUser.height);
                    document.getElementById('zoomSlider').value = fotoScale;
                    document.getElementById('sliderKontrol').classList.remove('hidden');
                    
                    const btn = document.getElementById('btnDownload');
                    btn.disabled = false;
                    btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                    btn.classList.add('bg-green-600', 'hover:bg-green-700');
                    gambarUlangCanvas();
                };
                fotoUser.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function gambarUlangCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (fotoUser.src) {
                ctx.save();
                ctx.translate(fotoX, fotoY);
                ctx.scale(fotoScale, fotoScale);
                ctx.drawImage(fotoUser, -fotoUser.width / 2, -fotoUser.height / 2);
                ctx.restore();
            }

            if (bingkaiTwibbon.complete) {
                ctx.drawImage(bingkaiTwibbon, 0, 0, canvas.width, canvas.height);
            }

            if (namaMember.trim() !== "") {
                ctx.save();
                ctx.font = "bold 32px sans-serif"; 
                ctx.fillStyle = "#3e2723"; // Warna huruf tulisan nama (Coklat gelap)
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(namaMember, 400, 858); // Koordinat posisi teks nama
                ctx.restore();
            }
        }

        document.getElementById('zoomSlider').addEventListener('input', function(e) {
            fotoScale = parseFloat(e.target.value);
            gambarUlangCanvas();
        });

        canvas.addEventListener('mousedown', (e) => { isDragging = true; startX = e.offsetX; startY = e.offsetY; });
        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || !fotoUser.src) return;
            const dx = e.offsetX - startX; const dy = e.offsetY - startY;
            const rect = canvas.getBoundingClientRect();
            fotoX += dx * (canvas.width / rect.width); fotoY += dy * (canvas.height / rect.height);
            startX = e.offsetX; startY = e.offsetY;
            gambarUlangCanvas();
        });
        window.addEventListener('mouseup', () => isDragging = false);

        canvas.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) {
                isDragging = true; const rect = canvas.getBoundingClientRect();
