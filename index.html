<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibbon Resmi Komunitas</title>
    <style>
        /* CSS Internal Murni - 100% Lancar dan Rapi di Vercel */
        body { 
            background-color: #f3f4f6; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            padding: 16px; 
            margin: 0; 
            min-height: 100vh; 
            box-sizing: border-box; 
        }
        .card { 
            background-color: white; 
            padding: 32px; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 440px; 
            text-align: center; 
            box-sizing: border-box; 
        }
        .title { 
            font-size: 24px; 
            font-weight: bold; 
            color: #1f2937; 
            margin-bottom: 8px; 
            margin-top: 0; 
        }
        .subtitle { 
            font-size: 14px; 
            color: #6b7280; 
            margin-bottom: 24px; 
        }
        .input-text { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            text-align: center; 
            margin-bottom: 16px; 
            box-sizing: border-box; 
            font-weight: 600; 
            font-size: 14px;
        }
        .btn-blue { 
            width: 100%; 
            background: #2563eb; 
            color: white; 
            font-weight: 600; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.2s; 
            font-size: 14px;
        }
        .btn-blue:hover { 
            background: #1d4ed8; 
        }
        .error-text { 
            color: #ef4444; 
            font-size: 14px; 
            margin-top: 12px; 
            display: none; 
        }
        #canvasContainer canvas { 
            max-width: 100%; 
            height: auto !important; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
        }
        .control-group { 
            text-align: left; 
            margin-bottom: 16px; 
        }
        .control-group label { 
            display: block; 
            font-size: 14px; 
            font-weight: 500; 
            color: #374151; 
            margin-bottom: 6px; 
        }
        .select-box { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #d1d5db; 
            border-radius: 8px; 
            background: white; 
            font-size: 14px; 
        }
        .range-slider { 
            width: 100%; 
            margin-top: 8px; 
            accent-color: #2563eb; 
        }
        .btn-download { 
            width: 100%; 
            background: #9ca3af; 
            color: white; 
            font-weight: bold; 
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            cursor: not-allowed; 
            margin-top: 16px; 
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- 1. HALAMAN LOGIN -->
    <div id="loginPage" class="card">
        <div style="display:flex; justify-content:center; margin-bottom:16px;">
            <img src="https://picsum.photos" id="communityLogoLogin" alt="Logo" style="width:80px; height:80px; object-fit:contain; border-radius:50%;">
        </div>
        <h1 class="title">🛡️ Twibbon Komunitas</h1>
        <p class="subtitle">Masukkan kata sandi komunitas untuk mengakses aplikasi.</p>
        <input type="password" id="passwordInput" placeholder="Kata Sandi Komunitas" class="input-text">
        <button onclick="cekPassword()" class="btn-blue">Masuk Aplikasi</button>
        <p id="loginError" class="error-text">Kata sandi salah, Bro! Silakan tanya admin.</p>
    </div>

    <!-- 2. HALAMAN UTAMA TWIBBON -->
    <div id="mainPage" class="card" style="display: none; max-width: 500px;">
        <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; border-bottom: 1px solid #f3f4f6; padding-bottom: 16px;">
            <img src="https://picsum.photos" id="communityLogoMain" alt="Logo" style="width:48px; height:48px; object-fit:contain; border-radius:50%;">
            <div style="text-align: left; margin-left: 8px;">
                <h1 style="font-size:18px; font-weight:bold; color:#1f2937; margin:0;">Twibbon Maker</h1>
                <p style="font-size:12px; color:#6b7280; margin:0;">Official Community Web App</p>
            </div>
        </div>

        <div id="canvasContainer" style="display:flex; justify-content:center; margin-bottom:24px; background:#f9fafb; padding:8px; border-radius:12px; border:1px dashed #d1d5db;">
            <canvas id="twibbonCanvas" width="800" height="800" style="width: 100%; max-width:360px; aspect-ratio: 1/1;"></canvas>
        </div>

        <div style="max-width: 360px; margin: 0 auto;">
            <div class="control-group">
                <label>1. Pilih Bingkai / Peringkat</label>
                <select id="pilihBingkai" onchange="gantiBingkai(this.value)" class="select-box">
                    <option value="umum">Bingkai Utama (Semua Member)</option>
                    <option value="rank1">Bingkai Peringkat 1 (Bronze)</option>
                    <option value="rank2">Bingkai Peringkat 2 (Silver)</option>
                </select>
            </div>

            <div class="control-group">
                <label>2. Tulis Nama Member</label>
                <input type="text" id="inputNama" oninput="updateNama(this.value)" placeholder="CONTOH: BUDI SANTOSO" class="input-text" style="text-transform: uppercase; margin-bottom: 0;">
            </div>

            <div class="control-group" style="margin-top: 16px;">
                <label>3. Upload Fotomu</label>
                <input type="file" id="uploadFoto" accept="image/*" style="font-size:14px; color:#6b7280; width: 100%;">
            </div>

            <div id="sliderKontrol" class="control-group" style="display:none;">
                <label>4. Atur Ukuran Foto (Zoom)</label>
                <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" value="1" class="range-slider">
            </div>

            <button id="btnDownload" onclick="downloadHasil()" disabled class="btn-download">
                5. Download Twibbon
            </button>
        </div>
    </div>

    <script>
        // --- KONFIGURASI UTAMA ---
        const PASSWORD_KOMUNITAS = "cr75rda"; 
        const URL_LOGO_KOMUNITAS = "https://ibb.co.com/JRt2pHj6"; // Gantilah dengan logo komunitasmu

        const DAFTAR_BINGKAI = {
            umum: "https://picsum.photos",  
            rank1: "https://picsum.photos", // Taruh direct link gambar Bronze (.png) di sini
            rank2: "https://picsum.photos"  
        };

        document.getElementById('communityLogoLogin').src = URL_LOGO_KOMUNITAS;
        document.getElementById('communityLogoMain').src = URL_LOGO_KOMUNITAS;

        const canvas = document.getElementById('twibbonCanvas');
        const ctx = canvas.getContext('2d');
        let fotoUser = new Image();
        let bingkaiTwibbon = new Image();

        let namaMember = "";
        let fotoX = 400, fotoY = 400;
        let fotoScale = 1;
        let isDragging = false;
        let startX, startY;

        function cekPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === PASSWORD_KOMUNITAS) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainPage').style.display = 'block';
                gantiBingkai('umum');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function gantiBingkai(key) {
            bingkaiTwibbon.crossOrigin = "anonymous"; 
            bingkaiTwibbon.src = DAFTAR_BINGKAI[key];
            bingkaiTwibbon.onload = () => { gambarUlangCanvas(); };
        }

        function updateNama(teks) {
            namaMember = teks.toUpperCase(); 
            gambarUlangCanvas();
        }

        document.getElementById('uploadFoto').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                fotoUser.onload = () => {
                    fotoX = canvas.width / 2; fotoY = canvas.height / 2;
                    fotoScale = Math.max(canvas.width / fotoUser.width, canvas.height / fotoUser.height);
                    document.getElementById('zoomSlider').value = fotoScale;
                    document.getElementById('sliderKontrol').style.display = 'block';
                    
                    const btn = document.getElementById('btnDownload');
                    btn.disabled = false;
                    btn.style.background = '#10b981';
                    btn.style.cursor = 'pointer';
                    gambarUlangCanvas();
                };
                fotoUser.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function gambarUlangCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (fotoUser.src) {
                ctx.save();
                ctx.translate(fotoX, fotoY);
                ctx.scale(fotoScale, fotoScale);
                ctx.drawImage(fotoUser, -fotoUser.width / 2, -fotoUser.height / 2);
